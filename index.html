<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Quest</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #38bdf8;
        }
        .score-board {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        #balance {
            color: #4ade80;
        }
        .bet-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .bet-grid button {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease;
        }
        .bet-grid button:active {
            transform: scale(0.97);
        }
        .bet-grid button:hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }
        #result-box {
            background-color: #0f172a;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #outcome-text {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🔮 Magic Quest</h1>
        <div class="score-board">
            <p>Tokens: <span id="balance">500</span></p>
        </div>

        <div class="bet-grid">
            <button onclick="playTier(10)">
                <strong>Bet 10</strong><br>Cost: 20 | Win: 100 🪙
            </button>
            <button onclick="playTier(100)">
                <strong>Bet 100 ⭐</strong><br>Cost: 200 | Win: 2,990 💍
            </button>
            <button onclick="playTier(1000)">
                <strong>Bet 1000 🔥</strong><br>Cost: 2000 | Win: 99,990 🐉
            </button>
        </div>

        <div id="result-box">
            <p id="outcome-text">Choose a bet to play!</p>
        </div>
    </div>

    <script>
        var tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
            }
        } catch (e) {
            console.log("Not running inside Telegram");
        }

        var betTiers = {
            10:  { cost: 20,   lose: 10,   win: 100,   icon: "🪙 Gold Coin" },
            100: { cost: 200,  lose: 10,   win: 2990,  icon: "💍 Ring", bonusEligible: true },
            1000:{ cost: 2000, lose: 200,  win: 99990, icon: "🐉 Water Dragon", bonusEligible: true }
        };

        var tokens = 500;
        var winChance = 0.40;

        function playTier(betAmount) {
            var tier = betTiers[betAmount];
            
            if (!tier || tokens < tier.cost) {
                if (tg && typeof tg.showAlert === 'function') {
                    tg.showAlert("Not enough tokens to cover this cost!");
                } else {
                    alert("Not enough tokens to cover this cost!");
                }
                return;
            }

            tokens -= tier.cost;

            var isWin = Math.random() <= winChance;
            var finalPayout = 0;
            var multiplier = 1;

            if (isWin) {
                finalPayout = tier.win;

                if (tier.bonusEligible) {
                    var bonusRoll = Math.random() * 100;
                    if (bonusRoll <= 5) {
                        multiplier = 5; 
                    } else if (bonusRoll <= 20) {
                        multiplier = 2; 
                    }
                    finalPayout *= multiplier;
                }
                
                if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === 'function') {
                    tg.HapticFeedback.impactOccurred('heavy');
                }
            } else {
                finalPayout = tier.lose; 
                if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === 'function') {
                    tg.HapticFeedback.impactOccurred('light');
                }
            }

            tokens += finalPayout;
            
            document.getElementById("balance").innerText = tokens;
            var outcomeText = document.getElementById("outcome-text");
            
            if (isWin) {
                outcomeText.innerHTML = "🎉 Won <b>" + finalPayout + "</b> tokens!<br>Reward: " + tier.icon + (multiplier > 1 ? " (x" + multiplier + " Bonus!)" : "");
            } else {
                outcomeText.innerHTML = "❌ Lost. Received rebate: " + tier.lose;
            }
        }
    </script>
</body>
</html>
