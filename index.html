<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Quest</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #38bdf8;
        }
        .score-board {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        #balance {
            color: #4ade80;
            display: inline-block;
            transition: transform 0.2s ease, color 0.2s ease;
        }
        .pulse-balance {
            transform: scale(1.2);
            color: #facc15 !important;
        }
        .bet-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 16px;
        }
        .bet-grid::-webkit-scrollbar {
            width: 6px;
        }
        .bet-grid::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        .bet-grid button {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease, filter 0.1s ease, opacity 0.2s ease;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bet-grid button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .bet-grid button:not(:disabled):active {
            transform: scale(0.97);
            filter: brightness(0.9);
        }
        .bet-grid button:not(:disabled):hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }
        .cost-label {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        #result-box {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.3s ease;
        }
        
        /* Prominent popup animation styling */
        #outcome-icon {
            font-size: 2.5rem;
            display: none;
            line-height: 1;
        }
        
        @keyframes dramaticPop {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        
        .animate-pop {
            display: block !important;
            animation: dramaticPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #outcome-text {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        @keyframes popWin {
            0% { transform: scale(0.95); background-color: #0f172a; border-color: #334155; }
            50% { transform: scale(1.05); background-color: #064e3b; border-color: #4ade80; }
            100% { transform: scale(1); background-color: #0f172a; border-color: #4ade80; }
        }
        @keyframes popLose {
            0% { transform: scale(0.95); background-color: #0f172a; border-color: #334155; }
            50% { transform: scale(1.05); background-color: #7f1d1d; border-color: #f87171; }
            100% { transform: scale(1); background-color: #0f172a; border-color: #f87171; }
        }
        @keyframes loadingPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; color: #38bdf8; }
        }
        .win-anim {
            animation: popWin 0.4s ease forwards;
        }
        .lose-anim {
            animation: popLose 0.4s ease forwards;
        }
        .loading-anim {
            animation: loadingPulse 0.5s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🔮 Magic Quest</h1>
        <div class="score-board">
            <p>Energy Tokens: <span id="balance">500</span></p>
        </div>

        <div class="bet-grid" id="button-container">
            <button onclick="playTier(1)"><span><strong>Quest 1</strong> 🪙</span><span class="cost-label">Cost: 2 energy</span></button>
            <button onclick="playTier(10)"><span><strong>Quest 10</strong> 🪙</span><span class="cost-label">Cost: 20 energy</span></button>
            <button onclick="playTier(25)"><span><strong>Quest 25</strong> 💎</span><span class="cost-label">Cost: 50 energy</span></button>
            <button onclick="playTier(50)"><span><strong>Quest 50</strong> 🔮</span><span class="cost-label">Cost: 100 energy</span></button>
            <button onclick="playTier(100)"><span><strong>Quest 100</strong> ⭐</span><span class="cost-label">Cost: 200 energy</span></button>
            <button onclick="playTier(200)"><span><strong>Quest 200</strong> 🛡️</span><span class="cost-label">Cost: 400 energy</span></button>
            <button onclick="playTier(300)"><span><strong>Quest 300</strong> ⚔️</span><span class="cost-label">Cost: 600 energy</span></button>
            <button onclick="playTier(500)"><span><strong>Quest 500</strong> 👑</span><span class="cost-label">Cost: 1,000 energy</span></button>
            <button onclick="playTier(1000)"><span><strong>Quest 1000</strong> 🐉</span><span class="cost-label">Cost: 2,000 energy</span></button>
        </div>

        <div id="result-box">
            <div id="outcome-icon"></div>
            <p id="outcome-text">Choose a quest to embark on!</p>
        </div>
    </div>

    <script>
        var tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
            }
        } catch (e) {
            console.log("Not running inside Telegram");
        }

        var betTiers = {
            1:    { cost: 2,    lose: 1,    win: 10,    icon: "🪙" },
            10:   { cost: 20,   lose: 10,   win: 100,   icon: "🪙" },
            25:   { cost: 50,   lose: 10,   win: 520,   icon: "💎" },
            50:   { cost: 100,  lose: 20,   win: 990,   icon: "🔮" },
            100:  { cost: 200,  lose: 10,   win: 2990,  icon: "⭐", bonusEligible: true, highTier: true },
            200:  { cost: 400,  lose: 20,   win: 5200,  icon: "🛡️", bonusEligible: true, highTier: true },
            300:  { cost: 600,  lose: 30,   win: 13140, icon: "⚔️", bonusEligible: true, highTier: true },
            500:  { cost: 1000, lose: 50,   win: 33440, icon: "👑", bonusEligible: true, highTier: true },
            1000: { cost: 2000, lose: 200,  win: 99990, icon: "🐉", bonusEligible: true, highTier: true }
        };

        var tokens = 500;
        var standardWinChance = 0.40;
        var highTierWinChance = 0.15;
        var isPlaying = false;

        function setButtonsEnabled(enabled) {
            var buttons = document.querySelectorAll("#button-container button");
            buttons.forEach(function(btn) {
                btn.disabled = !enabled;
            });
        }

        function playTier(betAmount) {
            if (isPlaying) return;
            
            var tier = betTiers[betAmount];
            
            if (!tier || tokens < tier.cost) {
                if (tg && typeof tg.showAlert === 'function') {
                    tg.showAlert("Not enough energy tokens!");
                } else {
                    alert("Not enough energy tokens!");
                }
                return;
            }

            isPlaying = true;
            setButtonsEnabled(false);

            tokens -= tier.cost;
            var balanceEl = document.getElementById("balance");
            balanceEl.innerText = tokens;

            var resultBox = document.getElementById("result-box");
            var outcomeText = document.getElementById("outcome-text");
            var outcomeIcon = document.getElementById("outcome-icon");

            // Hide everything and show loading state
            outcomeIcon.style.display = "none";
            outcomeIcon.className = "";
            resultBox.className = "";
            resultBox.classList.add("loading-anim");
            
            var steps = [
                "⚔️ Venturing into the unknown...",
                "🎲 Rolling fate...",
                "✨ Channeling magic..."
            ];
            
            var stepIndex = 0;
            outcomeText.innerHTML = steps[0];

            var interval = setInterval(function() {
                stepIndex++;
                if (stepIndex < steps.length) {
                    outcomeText.innerHTML = steps[stepIndex];
                }
            }, 300);

            setTimeout(function() {
                clearInterval(interval);
                
                var activeWinChance = tier.highTier ? highTierWinChance : standardWinChance;
                var isWin = Math.random() <= activeWinChance;
                var finalPayout = 0;
                var multiplier = 1;

                if (isWin) {
                    finalPayout = tier.win;

                    if (tier.bonusEligible) {
                        var bonusRoll = Math.random() * 100;
                        if (bonusRoll <= 5) {
                            multiplier = 5; 
                        } else if (bonusRoll <= 20) {
                            multiplier = 2; 
                        }
                        finalPayout *= multiplier;
                    }
                    
                    if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === 'function') {
                        tg.HapticFeedback.impactOccurred('heavy');
                    }
                } else {
                    finalPayout = tier.lose; 
                    if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === 'function') {
                        tg.HapticFeedback.impactOccurred('light');
                    }
                }

                tokens += finalPayout;
                
                balanceEl.innerText = tokens;
                balanceEl.classList.add("pulse-balance");
                setTimeout(function() {
                    balanceEl.classList.remove("pulse-balance");
                }, 200);

                resultBox.className = "";
                void resultBox.offsetWidth; 

                // Step 1: Clear text temporarily so the icon can pop up dramatically by itself first!
                outcomeText.innerHTML = "";
                
                if (isWin) {
                    outcomeIcon.innerHTML = "🏆";
                    resultBox.classList.add("win-anim");
                } else {
                    outcomeIcon.innerHTML = "💥";
                    resultBox.classList.add("lose-anim");
                }
                
                // Trigger the bouncing scale-up pop animation on the icon
                outcomeIcon.className = "";
                void outcomeIcon.offsetWidth;
                outcomeIcon.classList.add("animate-pop");

                // Step 2: Brief pause (300ms), then display the text smoothly underneath the popped icon
                setTimeout(function() {
                    if (isWin) {
                        outcomeText.innerHTML = "🎉 Quest Success! Earned <b>" + finalPayout + "</b> tokens!<br>Reward: " + tier.icon + (multiplier > 1 ? " (x" + multiplier + " Critical Bonus!)" : "");
                    } else {
                        outcomeText.innerHTML = "🛡️ Quest Failed. Recovered salvage: " + tier.lose;
                    }
                }, 250);

                isPlaying = false;
                setButtonsEnabled(true);

            }, 1000);
        }
    </script>
</body>
</html>
