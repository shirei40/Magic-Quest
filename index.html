<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Quest</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #38bdf8;
        }
        .score-board {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        #balance {
            color: #4ade80;
            display: inline-block;
            transition: transform 0.2s ease, color 0.2s ease;
        }
        .pulse-balance {
            transform: scale(1.2);
            color: #facc15 !important;
        }
        .bet-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 20px;
        }
        .bet-grid::-webkit-scrollbar {
            width: 6px;
        }
        .bet-grid::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        .bet-grid button {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease, filter 0.1s ease;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bet-grid button:active {
            transform: scale(0.97);
            filter: brightness(0.9);
        }
        .bet-grid button:hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }
        #result-box {
            background-color: #0f172a;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }
        #outcome-text {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        @keyframes winPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); border-color: #4ade80; background-color: #064e3b; }
            100% { transform: scale(1); }
        }
        @keyframes loseShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); border-color: #f87171; }
            75% { transform: translateX(4px); border-color: #f87171; }
        }
        .win-anim {
            animation: winPulse 0.4s ease;
        }
        .lose-anim {
            animation: loseShake 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🔮 Magic Quest</h1>
        <div class="score-board">
            <p>Tokens: <span id="balance">500</span></p>
        </div>

        <div class="bet-grid">
            <button onclick="playTier(1)"><span><strong>Bet 1</strong> (Cost: 2)</span><span>Win: 10 🪙</span></button>
            <button onclick="playTier(10)"><span><strong>Bet 10</strong> (Cost: 20)</span><span>Win: 100 🪙</span></button>
            <button onclick="playTier(25)"><span><strong>Bet 25</strong> (Cost: 50)</span><span>Win: 520 💎</span></button>
            <button onclick="playTier(50)"><span><strong>Bet 50</strong> (Cost: 100)</span><span>Win: 990 🔮</span></button>
            <button onclick="playTier(100)"><span><strong>Bet 100</strong> (Cost: 200)</span><span>Win: 2,990 ⭐</span></button>
            <button onclick="playTier(200)"><span><strong>Bet 200</strong> (Cost: 400)</span><span>Win: 5,200 🛡️</span></button>
            <button onclick="playTier(300)"><span><strong>Bet 300</strong> (Cost: 600)</span><span>Win: 13,140 ⚔️</span></button>
            <button onclick="playTier(500)"><span><strong>Bet 500</strong> (Cost: 1000)</span><span>Win: 33,440 👑</span></button>
            <button onclick="playTier(1000)"><span><strong>Bet 1000</strong> (Cost: 2000)</span><span>Win: 99,990 🐉</span></button>
        </div>

        <div id="result-box">
            <p id="outcome-text">Choose a bet to play!</p>
        </div>
    </div>

    <script>
        var tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
            }
        } catch (e) {
            console.log("Not running inside Telegram");
        }

        var betTiers = {
            1:    { cost: 2,    lose: 1,    win: 10,    icon: "🪙" },
            10:   { cost: 20,   lose: 10,   win: 100,   icon: "🪙" },
            25:   { cost: 50,   lose: 10,   win: 520,   icon: "💎" },
            50:   { cost: 100,  lose: 20,   win: 990,   icon: "🔮" },
            100:  { cost: 200,  lose: 10,   win: 2990,  icon: "⭐", bonusEligible: true },
            200:  { cost: 400,  lose: 20,   win: 5200,  icon: "🛡️", bonusEligible: true },
            300:  { cost: 600,  lose: 30,   win: 13140, icon: "⚔️", bonusEligible: true },
            500:  { cost: 1000, lose: 50,   win: 33440, icon: "👑", bonusEligible: true },
            1000: { cost: 2000, lose: 200,  win: 99990, icon: "🐉", bonusEligible: true }
        };

        var tokens = 500;
        var winChance = 0.40;

        function playTier(betAmount) {
            var tier = betTiers[betAmount];
            
            if (!tier || tokens < tier.cost) {
                if (tg && typeof tg.showAlert === 'function') {
                    tg.showAlert("Not enough tokens to cover this cost!");
                } else {
                    alert("Not enough tokens to cover this cost!");
                }
                return;
            }

            tokens -= tier.cost;

            var isWin = Math.random() <= winChance;
            var finalPayout = 0;
            var multiplier = 1;

            if (isWin) {
                finalPayout = tier.win;

                if (tier.bonusEligible) {
                    var bonusRoll = Math.random() * 100;
                    if (bonusRoll <= 5) {
                        multiplier = 5; 
                    } else if (bonusRoll <= 20) {
                        multiplier = 2; 
                    }
                    finalPayout *= multiplier;
                }
                
                if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === 'function') {
                    tg.HapticFeedback.impactOccurred('heavy');
                }
            } else {
                finalPayout = tier.lose; 
                if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === 'function') {
                    tg.HapticFeedback.impactOccurred('light');
                }
            }

            tokens += finalPayout;
            
            var balanceEl = document.getElementById("balance");
            balanceEl.innerText = tokens;
            balanceEl.classList.add("pulse-balance");
            setTimeout(function() {
                balanceEl.classList.remove("pulse-balance");
            }, 200);

            var resultBox = document.getElementById("result-box");
            var outcomeText = document.getElementById("outcome-text");
            
            if (isWin) {
                outcomeText.innerHTML = "🎉 Won <b>" + finalPayout + "</b> tokens!<br>Reward: " + tier.icon + (multiplier > 1 ? " (x" + multiplier + " Bonus!)" : "");
                resultBox.classList.remove("lose-anim");
                void resultBox.offsetWidth;
                resultBox.classList.add("win-anim");
            } else {
                outcomeText.innerHTML = "❌ Lost. Received rebate: " + tier.lose;
                resultBox.classList.remove("win-anim");
                void resultBox.offsetWidth;
                resultBox.classList.add("lose-anim");
            }
        }
    </script>
</body>
</html>
